apiVersion: search.miloapis.com/v1alpha1
kind: ResourceIndexPolicy
metadata:
  name: project-resource-index-policy
spec:
  conditions:
  - expression: has(metadata.name)
    name: has-name
  fields:
  - path: .metadata.name
    searchable: true
  - path: .metadata.annotations["kubernetes.io/display-name"]
    searchable: true
  - path: .metadata.annotations["kubernetes.io/description"]
    searchable: true
  # The owning organization, so searching an org name also finds its projects.
  - path: .spec.ownerRef.name
    searchable: true
  targetResource:
    group: resourcemanager.miloapis.com
    kind: Project
    version: v1alpha1
