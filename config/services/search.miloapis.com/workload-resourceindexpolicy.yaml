apiVersion: search.miloapis.com/v1alpha1
kind: ResourceIndexPolicy
metadata:
  name: workload-resource-index-policy
spec:
  conditions:
  - expression: has(metadata.name)
    name: has-name
  fields:
  - path: .metadata.name
    searchable: true
  - path: .metadata.namespace
    searchable: true
  - path: .metadata.annotations["kubernetes.io/display-name"]
    searchable: true
  - path: .metadata.annotations["kubernetes.io/description"]
    searchable: true
  - path: .status.replicas
    searchable: true
  - path: .status.readyReplicas
    searchable: true
  - path: .status.desiredReplicas
    searchable: true
  - path: .spec.placements[*].name
    searchable: true
  - path: .spec.placements[*].cityCodes[*]
    searchable: true
  - path: .spec.placements[*].locations[*].name
    searchable: true
  - path: .spec.template.spec.runtime.class
    searchable: true
  - path: .spec.template.spec.runtime.sandbox.containers[*].image
    searchable: true
  - path: .status.conditions[*].type
    searchable: false
  - path: .status.conditions[*].status
    searchable: false
  targetResource:
    group: compute.datumapis.com
    kind: Workload
    version: v1alpha
