apiVersion: search.miloapis.com/v1alpha1
kind: ResourceIndexPolicy
metadata:
  name: domain-resource-index-policy
spec:
  conditions:
  - expression: has(metadata.name)
    name: has-name
  fields:
  - path: .metadata.name
    searchable: true
  - path: .metadata.namespace
    searchable: true
  - path: .metadata.creationTimestamp
    searchable: false
  - path: .metadata.annotations["kubernetes.io/display-name"]
    searchable: true
  - path: .metadata.annotations["kubernetes.io/description"]
    searchable: true
  - path: .spec.domainName
    searchable: true
  - path: .status.registration.expiresAt
    searchable: false
  - path: .status.registration.registrar.name
    searchable: false
  - path: .status.nameservers[*].hostname
    searchable: true
  - path: .status.conditions[*].type
    searchable: false
  - path: .status.conditions[*].status
    searchable: false
  targetResource:
    group: networking.datumapis.com
    kind: Domain
    version: v1alpha
