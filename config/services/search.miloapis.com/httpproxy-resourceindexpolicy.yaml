apiVersion: search.miloapis.com/v1alpha1
kind: ResourceIndexPolicy
metadata:
  name: httpproxy-resource-index-policy
spec:
  conditions:
  - expression: has(metadata.name)
    name: has-name
  fields:
  - path: .metadata.name
    searchable: true
  - path: .metadata.namespace
    searchable: true
  - path: .metadata.creationTimestamp
    searchable: false
  # Portals store the ALB name people type as app.kubernetes.io/name
  # (chosenName). kubernetes.io/display-name is kept for older objects.
  - path: .metadata.annotations["app.kubernetes.io/name"]
    searchable: true
  - path: .metadata.annotations["kubernetes.io/display-name"]
    searchable: true
  - path: .metadata.annotations["kubernetes.io/description"]
    searchable: true
  - path: .metadata.ownerReferences[*].name
    searchable: true
  # The canonical <name>.datumproxy.net hostname is what customers paste into
  # tickets.
  - path: .status.canonicalHostname
    searchable: true
  - path: .spec.hostnames[*]
    searchable: true
  - path: .status.hostnameStatuses[*].hostname
    searchable: true
  - path: .status.addresses[*].value
    searchable: true
  - path: .spec.rules[*].name
    searchable: true
  - path: .spec.rules[*].backends[*].endpoint
    searchable: true
  - path: .spec.rules[*].backends[*].connector.name
    searchable: true
  - path: .spec.rules[*].backends[*].instance.name
    searchable: true
  - path: .status.conditions[*].type
    searchable: false
  - path: .status.conditions[*].status
    searchable: false
  targetResource:
    group: networking.datumapis.com
    kind: HTTPProxy
    version: v1alpha
